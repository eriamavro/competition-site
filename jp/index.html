<!DOCTYPE html>
<html lang="ja">
<head>

  <title>映像メディア系コンペ一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <nav class="language-switch" aria-label="言語切り替え">
        <a href="../">EN</a>
        <span aria-hidden="true">|</span>
        <a class="is-active" href="./" aria-current="page">JP</a>
      </nav>
      <nav class="nav" aria-label="主要ナビゲーション">

  <script src="../js/app.js"></script>

  <footer style="text-align:center; padding: 24px 16px;">
    <a href="https://www.eriadachi.com/pages/education/index-jp.html" style="display:inline-block; margin-top: 8px; font-size: 0.85em; opacity: 0.7;">← Eri Adachi</a>

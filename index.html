<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>映像メディア系コンペ一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">Competition List</p>
      <h1>映像メディア系コンペ一覧</h1>
      <p class="lead">日本の学生向けに整理した映像・アニメーション・ドキュメンタリー系コンペの一覧です。</p>
    </div>
  </header>

  <main class="page-shell">
    <section class="toolbar" aria-label="コンペ検索と絞り込み">
      <div>
        <h2>Category</h2>
        <div id="categoryFilters" class="filter-group" aria-label="カテゴリーで絞り込み"></div>
      </div>
      <p id="resultCount" class="result-count" aria-live="polite"></p>
    </section>

    <section id="competitionList" class="country-list" aria-label="コンペ一覧">
      <p class="loading">読み込み中...</p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
